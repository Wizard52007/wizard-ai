[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wizard-ai"
version = "0.1.0"
description = "A personal AI agent inspired by JARVIS."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
where = ["src"]